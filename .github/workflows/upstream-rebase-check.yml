name: Upstream rebase check

# Personal-fork automation, unrelated to NixOS/nixpkgs' own CI in this same
# directory. It answers one question daily: does `combined-fundamental` still
# rebase cleanly onto upstream/nixos-unstable? If yes, a ready-to-use
# `rebase-candidate` branch is (re)published. If no, an issue is opened or
# updated naming exactly what collided, and the run is marked failed so it
# also surfaces through GitHub's own "workflow run failed" notification.
#
# combined-fundamental is never pushed to by this workflow -- only the
# disposable `rebase-candidate` branch is. Adopting a clean rebase into
# combined-fundamental itself stays a manual decision.

on:
  schedule:
    # Daily, off-peak and off the hour to avoid GitHub's cron traffic spike.
    # Expect it late regardless: the first real scheduled run fired at 09:40Z
    # for a 05:17Z cron. GitHub delays scheduled workflows under load, so this
    # is "daily, eventually", not "daily at 05:17".
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# Guard against two runs racing to force-push rebase-candidate or edit the
# same issue. Never cancel a run already in progress -- let it finish so its
# conflict-or-not verdict is never half-written.
concurrency:
  group: upstream-rebase-check
  cancel-in-progress: false

env:
  UPSTREAM_REPO: NixOS/nixpkgs
  UPSTREAM_URL: https://github.com/NixOS/nixpkgs.git
  UPSTREAM_BRANCH: nixos-unstable
  BASE_BRANCH: combined-fundamental
  CANDIDATE_BRANCH: rebase-candidate
  ISSUE_LABEL: upstream-rebase-conflict

jobs:
  # Is there anything to replay at all? One API call, no checkout.
  #
  # WHY THIS EXISTS. The check job needs the full nixpkgs history
  # (fetch-depth: 0), which costs ~8 minutes before it can conclude anything.
  # Measured on the first real scheduled run: upstream had not moved, git said
  # "Current branch rebase-attempt is up to date", the push said "Everything
  # up-to-date", and the whole 8 minutes bought a verdict that was knowable
  # up front.
  #
  # STATE-FREE, deliberately. The obvious implementation records the last-seen
  # upstream SHA somewhere -- a branch, a tag, an Actions cache -- and every
  # one of those can drift out of sync with reality or be evicted, which is a
  # second thing to debug at 05:17. GitHub's cross-fork compare already knows
  # the answer without being told: behind_by counts exactly the upstream
  # commits this branch does not have, which is exactly what a rebase would
  # replay. Nothing to store, nothing to invalidate.
  probe:
    runs-on: ubuntu-latest
    outputs:
      behind: ${{ steps.compare.outputs.behind }}
      ahead: ${{ steps.compare.outputs.ahead }}
      base_sha: ${{ steps.compare.outputs.base_sha }}
    steps:
      - name: Compare against upstream
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compared in the UPSTREAM repo's namespace with head as
          # owner:branch -- the documented cross-fork form. Comparing inside
          # the fork instead would rely on an upstream SHA resolving there.
          gh api "repos/$UPSTREAM_REPO/compare/$UPSTREAM_BRANCH...${GITHUB_REPOSITORY%%/*}:$BASE_BRANCH" \
            > compare.json

          behind=$(jq -r '.behind_by' compare.json)
          ahead=$(jq -r '.ahead_by' compare.json)
          status=$(jq -r '.status' compare.json)
          mergebase=$(jq -r '.merge_base_commit.sha' compare.json)

          {
            echo "behind=$behind"
            echo "ahead=$ahead"
            echo "base_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BASE_BRANCH" --jq .commit.sha)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Upstream comparison"
            echo "- status: \`$status\`"
            echo "- upstream commits to replay (behind_by): **$behind**"
            echo "- local patches on top (ahead_by): $ahead"
            echo "- current rebase base: \`${mergebase:0:12}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # behind_by == 0: upstream is already contained in the branch, so a rebase
  # would replay nothing. That is not merely "skip" -- it is the CLEAN verdict,
  # reached without a clone, so it owes the same two side effects the clean
  # path owes: a candidate branch that matches, and no stale conflict issue.
  #
  # This is also what closes the loop when a conflict is fixed by hand: a
  # manual rebase makes the branch contain upstream again, behind_by drops to
  # 0, and the issue gets closed here rather than lingering.
  up-to-date:
    needs: probe
    if: needs.probe.outputs.behind == '0' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Point ${{ env.CANDIDATE_BRANCH }} at ${{ env.BASE_BRANCH }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.probe.outputs.base_sha }}
        run: |
          # Server-side ref update: no clone needed to move a branch to a
          # commit the remote already has. Create it if this is the first run.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$CANDIDATE_BRANCH" \
              -f sha="$BASE_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$CANDIDATE_BRANCH" -f sha="$BASE_SHA" >/dev/null
          fi
          echo "### :white_check_mark: Nothing to replay" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$BASE_BRANCH\` already contains \`$UPSTREAM_BRANCH\`; \`$CANDIDATE_BRANCH\` set to \`${BASE_SHA:0:12}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Close resolved conflict issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Resolved: \`$BASE_BRANCH\` now contains \`$UPSTREAM_BRANCH\`, so there is nothing left to replay."
          fi

  check:
    needs: probe
    if: needs.probe.outputs.behind != '0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ env.BASE_BRANCH }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Fetch upstream
        run: git fetch "$UPSTREAM_URL" "$UPSTREAM_BRANCH"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure the conflict label exists
        # gh issue create --label errors on a label that doesn't exist yet; it
        # does not create one. Issues were only just enabled on this fork, so
        # it starts with GitHub's default seeded set (bug, enhancement, ...),
        # not this one. --force makes this create-or-update, so it's safe to
        # run unconditionally on every invocation rather than checking first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --force \
            --color "B60205" \
            --description "combined-fundamental no longer rebases cleanly onto upstream"

      - name: Attempt the rebase
        id: rebase
        run: |
          set +e
          git switch -c rebase-attempt
          git rebase FETCH_HEAD
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "conflict=true" >> "$GITHUB_OUTPUT"

          {
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/'
            echo
            echo "The commit that would not apply:"
            echo '```'
            git log -1 --format='%H %s%n%an <%ae>' REBASE_HEAD
            echo '```'
          } > conflict-report.md

          git rebase --abort

      - name: Push ${{ env.CANDIDATE_BRANCH }}
        if: steps.rebase.outputs.conflict == 'false'
        run: git push origin "rebase-attempt:$CANDIDATE_BRANCH" --force

      - name: Find existing conflict issue
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" \
            --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update conflict issue
        if: steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_sha=$(git rev-parse --short=12 FETCH_HEAD)
          {
            echo "Rebasing \`$BASE_BRANCH\` onto \`$UPSTREAM_BRANCH\` @ \`$upstream_sha\` no longer applies cleanly."
            echo
            cat conflict-report.md
            echo
            echo "Checked automatically by \`.github/workflows/upstream-rebase-check.yml\` on $(date -u +%FT%TZ)."
            echo "To resolve: rebase \`$BASE_BRANCH\` locally, fix the conflict, force-push, then close this issue -- or let a later run auto-close it once the rebase is clean again."
          } > issue-body.md

          if [ -n "${{ steps.find_issue.outputs.number }}" ]; then
            gh issue edit "${{ steps.find_issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "nixpkgs rebase conflict against $UPSTREAM_BRANCH" \
              --label "$ISSUE_LABEL" --body-file issue-body.md
          fi

      - name: Close resolved conflict issue
        if: steps.rebase.outputs.conflict == 'false' && steps.find_issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ steps.find_issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --comment "Resolved: rebase onto $UPSTREAM_BRANCH now succeeds cleanly. See the \`$CANDIDATE_BRANCH\` branch."

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.rebase.outputs.conflict }}" = "true" ]; then
            echo "### :x: Rebase conflict" >> "$GITHUB_STEP_SUMMARY"
            cat conflict-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :white_check_mark: Rebases cleanly onto \`$UPSTREAM_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Pushed to \`$CANDIDATE_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on conflict
        if: steps.rebase.outputs.conflict == 'true'
        run: |
          echo "::error::$BASE_BRANCH no longer rebases cleanly onto $UPSTREAM_BRANCH -- see the opened issue."
          exit 1
